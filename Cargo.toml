[package]
name = "search-things"
version = "2.0.0"
edition = "2024"
description = "Parallel text file search tool with progress tracking"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
encoding_rs_io = "0.1"
rayon = "1"
regex = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
